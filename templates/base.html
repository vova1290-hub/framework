{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Учёт КП{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link href="{% static 'homepage/css/style.css' %}" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <img
                class="site-logo"
                src="{% static 'homepage/img/logo.png' %}"
                alt="Учёт КП"
            >
            {% include "includes/navigation.html" %}
        </div>
    </header>
    <main class="site-main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer class="site-footer">
        <div class="container">
            <p>© <span id="current-year"></span> Учёт КП</p>
        </div>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
