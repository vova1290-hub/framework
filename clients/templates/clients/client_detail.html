{% extends "base.html" %}

{% block title %}Клиент{% endblock %}

{% block content %}
{% if client %}
    <article class="card client-card">
        <div class="card-body">
            <h1 class="h3 card-title">{{ client.name|default:"Без названия" }}</h1>
            <p>ID: {{ client.id }}</p>
            <p>Сумма: {{ total_amount|floatformat:2 }}</p>
        </div>
    </article>
{% else %}
    <h1>Клиент не найден</h1>
{% endif %}
<p class="mt-3">
    <a href="{% url 'clients:list' %}">К списку клиентов</a>
</p>
{% endblock %}
